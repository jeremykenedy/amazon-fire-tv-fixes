<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200"><style>.fish{transform-box:fill-box;transform-origin:center}.fish-a{animation:swim-a 14s ease-in-out infinite}.fish-b{animation:swim-b 11s ease-in-out -4s infinite}.fish-c{animation:swim-c 9s ease-in-out -6s infinite}.bubble{animation:rise 4s ease-in infinite}.bubble-b{animation-delay:-1.3s}.bubble-c{animation-delay:-2.6s}.star{animation:twinkle 3s ease-in-out infinite alternate}.star-b{animation-delay:-1.5s}@keyframes swim-a{0%{transform:translate(-14px,0) scaleX(1)}23%{transform:translate(40px,5px) scaleX(1)}46%{transform:translate(94px,-3px) scaleX(1)}50%{transform:translate(94px,-3px) scaleX(-1)}73%{transform:translate(40px,4px) scaleX(-1)}96%{transform:translate(-14px,0) scaleX(-1)}to{transform:translate(-14px,0) scaleX(1)}}@keyframes swim-b{0%{transform:translate(44px,0) scaleX(1)}4%{transform:translate(44px,0) scaleX(-1)}27%{transform:translate(-14px,-6px) scaleX(-1)}50%{transform:translate(-72px,-2px) scaleX(-1)}54%{transform:translate(-72px,-2px) scaleX(1)}77%{transform:translate(-14px,4px) scaleX(1)}to{transform:translate(44px,0) scaleX(1)}}@keyframes swim-c{0%{transform:translate(20px,0) scaleX(1)}4%{transform:translate(20px,0) scaleX(-1)}50%{transform:translate(-102px,8px) scaleX(-1)}54%{transform:translate(-102px,8px) scaleX(1)}to{transform:translate(20px,0) scaleX(1)}}@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(2px,-26px)}85%{opacity:.9}to{transform:translate(0,-50px);opacity:0}}@keyframes twinkle{0%{opacity:.25}to{opacity:1}}@media (prefers-reduced-motion:reduce){.fish,.bubble,.star{animation:none}}</style><rect width="800" height="200" fill="#fff" stroke="#e5e7eb" rx="16"/><g transform="translate(600,34)"><rect width="170" height="112" fill="none" stroke="#6d28d9" stroke-width="3" rx="10"/><rect width="146" height="88" x="12" y="12" fill="#eff6ff" rx="4"/><rect width="146" height="56" x="12" y="32" fill="#bfdbfe"/><rect width="146" height="12" x="12" y="88" fill="#fde68a"/><g fill="#fff" stroke="#60a5fa" stroke-width=".8"><circle class="bubble" cx="30" cy="84" r="1.8"/><circle class="bubble bubble-b" cx="74" cy="86" r="1.4"/><circle class="bubble bubble-c" cx="142" cy="85" r="2.2"/></g><g class="fish fish-a"><ellipse cx="48" cy="52" fill="#f97316" rx="10" ry="6"/><path fill="#f97316" d="M38.0 52 l-7.0 -5.0 v10.0 z"/></g><g class="fish fish-b"><ellipse cx="102" cy="66" fill="#3b82f6" rx="8" ry="4.8"/><path fill="#3b82f6" d="M94.0 66 l-5.6 -4.0 v8.0 z"/></g><g class="fish fish-c"><ellipse cx="128" cy="46" fill="#22c55e" rx="6" ry="3.6"/><path fill="#22c55e" d="M122.0 46 l-4.2 -3.0 v6.0 z"/></g><circle cx="24" cy="-6" r="13" fill="#f59e0b"/><circle cx="31" cy="-11" r="11" fill="#fff"/><circle class="star" cx="60" cy="-12" r="2.5" fill="#c4b5fd"/><circle class="star star-b" cx="150" cy="-8" r="2" fill="#c4b5fd"/><rect width="40" height="5" x="65" y="118" fill="#6d28d9" rx="2.5"/></g><text x="40" y="80" fill="#0f172a" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Fire TV Toolkit</text><text x="40" y="110" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">Ad-free screensavers, a better home screen, and the Alexa deep-sleep fix.</text><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="500" text-anchor="middle"><rect width="70" height="22" x="40" y="128" fill="#f5f3ff" stroke="#8b5cf6" stroke-width=".8" rx="11"/><text x="75" y="142.5" fill="#6d28d9">Alexa Fix</text><rect width="130" height="22" x="118" y="128" fill="#eff6ff" stroke="#3b82f6" stroke-width=".8" rx="11"/><text x="183" y="142.5" fill="#1e40af">Ad-Free Screensavers</text><rect width="100" height="22" x="256" y="128" fill="#f0fdf4" stroke="#22c55e" stroke-width=".8" rx="11"/><text x="306" y="142.5" fill="#166534">AT4K or LTV Home</text><rect width="86" height="22" x="364" y="128" fill="#fffbeb" stroke="#f59e0b" stroke-width=".8" rx="11"/><text x="407" y="142.5" fill="#b45309">On-TV Picker</text><rect width="80" height="22" x="458" y="128" fill="#fef2f2" stroke="#ef4444" stroke-width=".8" rx="11"/><text x="498" y="142.5" fill="#b91c1c">No Tracking</text></g></svg>
