build:
  nodes:
    analysis:
      environment:
        node: "16"
      tests:
        override:
          - js-scrutinizer-run
    tests:
      environment:
        docker: true
      commands:
        - pwd && ls -la . && ls -la /home/scrutinizer/build && docker run --rm -v /home/scrutinizer/build:/repo -w /repo node:20-alpine sh -c "ls -la /repo && npm ci && npm test"

checks:
  javascript: true

filter:
  excluded_paths:
    - "test/*"
    - "node_modules/*"
    - "screensavers/*"
    - "docs/*"
