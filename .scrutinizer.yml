build:
  nodes:
    analysis:
      environment:
        node: "16"
      tests:
        override:
          - js-scrutinizer-run
    tests:
      environment:
        docker: true
      commands:
        - docker run --rm node:20-alpine sh -c "apk add --no-cache git && git clone --depth 1 https://github.com/jeremykenedy/fire-tv-toolkit.git /repo && cd /repo && npm ci && npm test"

checks:
  javascript: true

filter:
  excluded_paths:
    - "test/*"
    - "node_modules/*"
    - "screensavers/*"
    - "docs/*"
