build:
  nodes:
    analysis:
      environment:
        node: "16"
      tests:
        override:
          - js-scrutinizer-run
    tests:
      environment:
        docker: true
      dependencies:
        override:
          - true
      tests:
        override:
          - docker run --rm -v $(pwd):/repo -w /repo node:20-alpine sh -c "npm ci && npm test"

checks:
  javascript: true

filter:
  excluded_paths:
    - "test/*"
    - "node_modules/*"
    - "screensavers/*"
    - "docs/*"
